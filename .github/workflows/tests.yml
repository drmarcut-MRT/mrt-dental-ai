name: Tests and sensitive-file check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/check_sensitive.py
      - run: python -m pytest -q
      - run: node --check app/static/app.js
      - run: node --check app/static/dictation.js
      - run: node --test tests/test_dictation.cjs
      - name: Check Gunicorn configuration
        run: gunicorn --check-config run:app
